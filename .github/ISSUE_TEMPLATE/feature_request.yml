name: Feature request
description: Suggest a new capability or improvement
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Lead with the use case, not the implementation. What can't you do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: A rough sketch is fine. Don't worry about being detailed.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds you've tried, or other tools that solve this.

  - type: checkboxes
    id: contribution
    attributes:
      label: Would you contribute this?
      options:
        - label: I'd be open to opening a PR if we agree on the design.
