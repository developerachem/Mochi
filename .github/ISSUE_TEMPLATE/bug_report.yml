name: Bug report
description: Something in the Mochi plugin, Chrome extension, or Continuum hooks is broken
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. The more concrete the repro, the faster we can fix it.

  - type: input
    id: version
    attributes:
      label: Plugin version
      description: Output of `/plugin list` (or the version from `~/.claude/plugins/cache/mochi/mochi/<version>/`)
      placeholder: "0.3.0"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which part is affected?
      multiple: true
      options:
        - Chrome extension (mochi)
        - Browser MCP server
        - Continuum hooks / commands
        - Plugin install / packaging
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, what did you get?
      placeholder: "I ran `browser_click` on Gmail and it returned `chrome.debugger attach failed`."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. /plugin install mochi@mochi
        2. browser_session_start
        3. browser_navigate to ...
        4. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / errors
      description: Browser SW console (`chrome://extensions` → service worker), MCP server output, or any `[mochi:dbg]` lines.
      render: text

  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "macOS 15.x, Chrome 130, Node 22, Claude Code <version>"
