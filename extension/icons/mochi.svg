<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="mochiBody" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0%"  stop-color="#fff5fa"/>
      <stop offset="55%" stop-color="#ffd9e8"/>
      <stop offset="100%" stop-color="#ffb3d1"/>
    </radialGradient>
    <radialGradient id="mochiBlush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#ff8ab8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff8ab8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mochiSparkle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="64" cy="118" rx="40" ry="5" fill="#000" opacity="0.10"/>

  <!-- mochi body: round-squishy blob, slightly wider at the bottom -->
  <path d="M 18 56
           C 18 30, 38 14, 64 14
           C 90 14, 110 30, 110 56
           C 110 86, 92 112, 64 112
           C 36 112, 18 86, 18 56 Z"
        fill="url(#mochiBody)" stroke="#ff9ec5" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- top-left soft highlight -->
  <ellipse cx="44" cy="36" rx="16" ry="9" fill="#ffffff" opacity="0.55"/>

  <!-- blush cheeks -->
  <circle cx="34" cy="68" r="11" fill="url(#mochiBlush)"/>
  <circle cx="94" cy="68" r="11" fill="url(#mochiBlush)"/>

  <!-- eyes: large shiny dots with white catch-lights -->
  <g fill="#3a1a2a">
    <ellipse cx="48" cy="58" rx="6" ry="7.5"/>
    <ellipse cx="80" cy="58" rx="6" ry="7.5"/>
  </g>
  <g fill="#ffffff">
    <circle cx="50" cy="55" r="2"/>
    <circle cx="82" cy="55" r="2"/>
  </g>

  <!-- happy smile -->
  <path d="M 54 80 Q 64 89 74 80"
        stroke="#3a1a2a" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- sparkle accents — extra cuteness -->
  <g opacity="0.95">
    <circle cx="22" cy="32" r="4" fill="url(#mochiSparkle)"/>
    <path d="M 22 28 L 22 36 M 18 32 L 26 32"
          stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
    <circle cx="106" cy="46" r="3" fill="url(#mochiSparkle)"/>
    <path d="M 106 43 L 106 49 M 103 46 L 109 46"
          stroke="#fff" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- tiny neon-pink cursor peeking out (callback to overlay cursor) -->
  <g transform="translate(96,90) rotate(-12)">
    <path d="M 0 0 L 0 13 L 4 10 L 7 17 L 10 16 L 7 9 L 13 9 Z"
          fill="#f472b6" stroke="#fdf4ff" stroke-width="0.9" stroke-linejoin="round"/>
  </g>
</svg>
