<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        width: 280px;
        margin: 0;
        padding: 14px;
        color: #1a1a1a;
        background: #fafafa;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 10px 0;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #666;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        border-bottom: 1px solid #eee;
      }
      .row:last-child { border-bottom: none; }
      .label { font-size: 12px; color: #444; }
      .value { font-size: 12px; font-weight: 600; }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 5px;
        vertical-align: middle;
      }
      .ok { background: #16a34a; }
      .bad { background: #dc2626; }
      .idle { background: #9ca3af; }
      .standby { background: #f59e0b; }
      button {
        width: 100%;
        margin-top: 10px;
        padding: 8px;
        border: 1px solid #d4d4d4;
        background: #fff;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover { background: #f3f4f6; }
      button.primary { background: #2563eb; color: white; border-color: #2563eb; }
      button.primary:hover { background: #1d4ed8; }
      button.danger { color: #b91c1c; border-color: #fecaca; }
      .hint { font-size: 11px; color: #888; margin-top: 8px; line-height: 1.4; }
      .claude-section { margin-top: 14px; padding-top: 12px; border-top: 1px solid #eee; }
      .claude-section h2 {
        font-size: 11px; margin: 0 0 8px 0; text-transform: uppercase;
        letter-spacing: 0.05em; color: #666;
      }
      .session-row {
        display: flex; justify-content: space-between; align-items: center;
        padding: 4px 0; font-size: 12px;
      }
      .session-name { color: #1a1a1a; font-weight: 500; flex: 1; min-width: 0;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .session-badge {
        background: #f59e0b; color: white; font-size: 10px; font-weight: 600;
        padding: 1px 6px; border-radius: 8px; margin-left: 6px;
      }
      .session-badge.empty { background: #d4d4d4; }
      #claude-empty { font-size: 11px; color: #888; padding: 4px 0; }
      #claude-form { margin-top: 8px; }
      #claude-form select, #claude-form textarea {
        width: 100%; font-size: 12px; padding: 6px; box-sizing: border-box;
        border: 1px solid #d4d4d4; border-radius: 4px;
        font-family: inherit;
      }
      #claude-form textarea { resize: vertical; min-height: 50px; margin-top: 6px; }
      #claude-form label { display: flex; align-items: center; font-size: 11px;
        color: #555; margin-top: 6px; gap: 5px; }
      #claude-form .status { font-size: 11px; color: #16a34a; margin-top: 4px; min-height: 14px; }
      #claude-form .status.err { color: #dc2626; }
    </style>
  </head>
  <body>
    <h1>Mochi</h1>
    <div class="row">
      <span class="label">Bridge</span>
      <span class="value"><span id="status-dot" class="dot idle"></span><span id="status-text">…</span></span>
    </div>
    <div class="row">
      <span class="label">Session</span>
      <span class="value" id="session-text">none</span>
    </div>
    <div class="row">
      <span class="label">Auto-connect</span>
      <span class="value" id="enabled-text">…</span>
    </div>
    <div class="row">
      <span class="label">Show agent cursor</span>
      <span class="value"><input type="checkbox" id="visuals-cursor" /></span>
    </div>
    <div class="row">
      <span class="label">Show action HUD</span>
      <span class="value"><input type="checkbox" id="visuals-hud" /></span>
    </div>
    <div class="row">
      <span class="label">SlowMo (ms)</span>
      <span class="value"><input type="number" id="visuals-slowmo" min="0" max="5000" step="50" style="width:64px;" /></span>
    </div>
    <button id="take-over-btn" class="primary" style="display:none;">Take over (make this profile active)</button>
    <button id="toggle-btn">Toggle auto-connect</button>
    <button id="end-session-btn" class="danger">End session</button>
    <p class="hint">
      Each AI session is a tab group. Your other tabs are not touched. Drag a tab out of the group to release it.
    </p>

    <div class="claude-section">
      <h2>Claude Sessions</h2>
      <div id="claude-list">
        <div id="claude-empty">No Claude sessions registered. Start Claude with the Continuum plugin.</div>
      </div>
      <div id="claude-form" style="display:none;">
        <select id="claude-target"></select>
        <textarea id="claude-message" placeholder="Hint to push into the agent's next tool call…" maxlength="2000"></textarea>
        <label>
          <input type="checkbox" id="claude-include-ctx" checked />
          Include current tab URL + recent console errors
        </label>
        <button id="claude-send-btn" class="primary" style="margin-top:8px;">Send hint</button>
        <div id="claude-status" class="status"></div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
