<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        width: 280px;
        margin: 0;
        padding: 14px;
        color: #1a1a1a;
        background: #fafafa;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 10px 0;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #666;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        border-bottom: 1px solid #eee;
      }
      .row:last-child { border-bottom: none; }
      .label { font-size: 12px; color: #444; }
      .value { font-size: 12px; font-weight: 600; }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 5px;
        vertical-align: middle;
      }
      .ok { background: #16a34a; }
      .bad { background: #dc2626; }
      .idle { background: #9ca3af; }
      .standby { background: #f59e0b; }
      button {
        width: 100%;
        margin-top: 10px;
        padding: 8px;
        border: 1px solid #d4d4d4;
        background: #fff;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover { background: #f3f4f6; }
      button.primary { background: #2563eb; color: white; border-color: #2563eb; }
      button.primary:hover { background: #1d4ed8; }
      button.danger { color: #b91c1c; border-color: #fecaca; }
      .hint { font-size: 11px; color: #888; margin-top: 8px; line-height: 1.4; }
    </style>
  </head>
  <body>
    <h1>Super-Tester</h1>
    <div class="row">
      <span class="label">Bridge</span>
      <span class="value"><span id="status-dot" class="dot idle"></span><span id="status-text">…</span></span>
    </div>
    <div class="row">
      <span class="label">Session</span>
      <span class="value" id="session-text">none</span>
    </div>
    <div class="row">
      <span class="label">Auto-connect</span>
      <span class="value" id="enabled-text">…</span>
    </div>
    <div class="row">
      <span class="label">Show agent cursor</span>
      <span class="value"><input type="checkbox" id="visuals-cursor" /></span>
    </div>
    <div class="row">
      <span class="label">Show action HUD</span>
      <span class="value"><input type="checkbox" id="visuals-hud" /></span>
    </div>
    <div class="row">
      <span class="label">SlowMo (ms)</span>
      <span class="value"><input type="number" id="visuals-slowmo" min="0" max="5000" step="50" style="width:64px;" /></span>
    </div>
    <button id="take-over-btn" class="primary" style="display:none;">Take over (make this profile active)</button>
    <button id="toggle-btn">Toggle auto-connect</button>
    <button id="end-session-btn" class="danger">End session</button>
    <p class="hint">
      Each AI session is a tab group. Your other tabs are not touched. Drag a tab out of the group to release it.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
